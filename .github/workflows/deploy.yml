name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # フォークからの PR では secrets が渡らずデプロイが必ず失敗するため、同一リポジトリの PR に限る
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 新しいコードが新しいスキーマを前提にするため、本番のデプロイより先に D1 のマイグレーションを当てる
      - if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler d1 migrations apply hitori-mahjong-db --remote
      - if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy
      # PR は本番に切り替えずにバージョンだけ上げ、PR ごとのプレビュー URL を発行する
      - id: deploy
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # tee に渡すと wrangler が失敗しても成功扱いになるため、pipefail で失敗を拾う
        run: |
          set -o pipefail
          pnpm wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee out.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' out.log | grep -v '^https://pr-' | head -1)" >> "$GITHUB_OUTPUT"
          echo "alias=$(grep -oE 'https://pr-[a-z0-9.-]+\.workers\.dev' out.log | head -1)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
        # push のたびにコメントが増えると読みにくいため、前回のコメントを編集する
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "Preview: ${ALIAS:-$URL}"$'\n'"Commit: ${URL} (${{ github.sha }})"
