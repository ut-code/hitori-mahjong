name: Keep Render Server Alive

on:
  # why was actions disallowed? disabling this cron in case.
  # schedule:
  # - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-26.04

    steps:
      - name: Send Keep Alive Request
        run: |
          curl -s -o /dev/null -w "%{http_code}" ${{ secrets.API_URL }}/health
